# Docker's default json-file log driver has no size cap on its own — left
# unset, months of passed-through cron/git/HTTP-access-log output would
# grow the on-disk log files without bound. Applied to every service below.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  # The trusted tier: holds broker credentials (via env_file below — never
  # baked into the image) and is the only service that writes to state/,
  # reports/, or logs/. Everything else in this file is read-only and
  # secretless; see docs/architecture.md and SECURITY.md for the full trust
  # model. Runs supercronic against the baked-in deploy/crontab — "the image
  # is what runs" is now literally true for the trading logic (see
  # AGENTS.md), so an edit only takes effect through a new image tag.
  engine:
    image: ghcr.io/austinwinstanley/trading-bot-engine:${ENGINE_TAG:?set ENGINE_TAG in deploy/.env, e.g. v0.1.0 or latest}
    container_name: trading-bot-engine
    restart: unless-stopped
    # Must match the host uid:gid that owns the bind-mounted state/reports/
    # logs directories below — a bind mount's on-disk ownership is whatever
    # the host already set, it does not shift to match an in-image user.
    # `id -u`/`id -g` of the account that currently owns these directories.
    user: "${ENGINE_UID:-1000}:${ENGINE_GID:-1000}"
    env_file:
      # ONLY this service gets .env — dashboard/mcp-server below stay
      # structurally unable to read it (no env_file, no volume mount
      # naming it). See SECURITY.md.
      - ../.env
    # >= the longest single job timeout in scripts/paper.sh (weekly, 3000s)
    # plus slack: a graceful `docker compose stop`/`down` sends SIGTERM,
    # which stops supercronic from scheduling NEW jobs but must not SIGKILL
    # one already in flight. deploy/upgrade.sh drains the daily/daily2x/
    # weekly locks before ever stopping this service, so in practice a stop
    # should find nothing running — this is the backstop, not the plan.
    stop_grace_period: 55m
    logging: *default-logging
    volumes:
      - ../state:/app/state
      - ../reports:/app/reports
      - ../logs:/app/logs
    healthcheck:
      # supercronic itself has no health endpoint; confirming the process
      # is alive is what matters — a crashed scheduler means no future job
      # ever fires again, silently, until something checks `docker ps`.
      test: ["CMD", "pgrep", "-f", "supercronic"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nightly journal committer: the only piece of "the server checkout is a
  # git checkout" that containerization needs to preserve. reports/ stays
  # git-tracked and public (this repo's paper-trading record) even though
  # the engine now deploys as an image, not a git pull — this service
  # commits the engine's runtime-written reports/paper*/ files back and
  # pulls dev-committed research (including reports/experiments/*.json
  # registrations the engine's config validation reads at startup — see
  # engine/config.py) into the same checkout the engine mounts read/write.
  # Deliberately the ONLY service with a git credential; the engine gets
  # no git access, and this service gets no broker credentials.
  journal:
    image: ghcr.io/austinwinstanley/trading-bot-journal:${JOURNAL_TAG:-latest}
    container_name: trading-bot-journal
    restart: unless-stopped
    user: "${ENGINE_UID:-1000}:${ENGINE_GID:-1000}"
    environment:
      # A repo-scoped deploy key with write access to THIS repo only —
      # never the broad credential a human's `git push` would use.
      # StrictHostKeyChecking stays on (the default): deploy/known_hosts.github
      # pins GitHub's own published host keys at image build time, so this
      # never falls back to trust-on-first-connect.
      - GIT_SSH_COMMAND=ssh -i /run/secrets/journal_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
    logging: *default-logging
    volumes:
      # The whole checkout, read-write: `git add`/`commit`/`push` need the
      # working tree and .git/ both, not just reports/.
      - ..:/repo
    secrets:
      - journal_deploy_key

  dashboard:
    image: ghcr.io/austinwinstanley/trading-bot-dashboard:${DASHBOARD_TAG:-latest}
    container_name: trading-bot-dashboard
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Published on all host interfaces (LAN-reachable), not loopback-only.
      # The app has zero login/auth by design — anyone who can reach the
      # server's IP on this network sees live paper-account data
      # (positions, equity, trade history) with no gate at all. Chosen
      # deliberately over Tailscale/SSH-tunnel for same-network access
      # without a login. If this ever needs to be internet-facing instead
      # of LAN-only, add auth first — don't just widen this further.
      - "0.0.0.0:8787:8787"
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../config_2x.yaml:/app/config_2x.yaml:ro
      - ../state:/app/state:ro
      # reports/ and logs/ (added with the /research and /notes panels)
      # follow the mcp-server service's precedent below — read-only, and
      # reachable only through the path-traversal-guarded readers in
      # dashboard/files.py. .env stays structurally unreachable from
      # inside the container, not just unread by convention.
      - ../reports:/app/reports:ro
      - ../logs:/app/logs:ro
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/base/summary', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-server:
    image: ghcr.io/austinwinstanley/trading-bot-mcp-server:${MCP_TAG:-latest}
    container_name: trading-bot-mcp-server
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Same LAN-exposed, no-auth posture as `dashboard` above (see that
      # service's comment) — an already-approved precedent, not a new
      # decision. This one additionally exposes ad hoc read-only SQL
      # against the journals (query_database — SELECT/WITH only, see
      # mcp_server/debug.py) and raw config/state/reports/log reads. If
      # this ever needs to be internet-facing, add auth first.
      - "0.0.0.0:8788:8788"
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../config_2x.yaml:/app/config_2x.yaml:ro
      - ../state:/app/state:ro
      # New mounts beyond what `dashboard` gets — both read-only, both
      # exposed only through the path-traversal-guarded helpers in
      # mcp_server/debug.py, never as raw filesystem access.
      - ../reports:/app/reports:ro
      - ../logs:/app/logs:ro
      # Deliberately nothing else mounted — .env is structurally
      # unreachable from inside the container, not just unread by
      # convention (same guarantee as `dashboard`, same reasoning).
    healthcheck:
      # A bare TCP connect, not a protocol-aware HTTP GET: the streamable-
      # http transport expects a JSON-RPC POST body with specific Accept/
      # Mcp-Session-Id headers, which isn't a one-line CMD to fake
      # correctly. This only confirms the port is accepting connections.
      test: ["CMD", "python3", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 8788), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  # A repo-scoped SSH deploy key (write access to THIS repo only, generated
  # separately from any human's personal key) — NOT a copy of .env, NOT
  # readable by the engine service. Provision the actual key file at
  # deploy/secrets/journal_deploy_key on the server (gitignored) before
  # bringing the journal service up; see docs/operations.md.
  journal_deploy_key:
    file: ./secrets/journal_deploy_key
