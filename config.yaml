# Trading bot configuration.
#
# EVERY risk limit lives here. Nothing is hardcoded in Python.
# This file is version-controlled: each change is an auditable diff you can
# correlate against the equity curve later.
#
# An invalid config HALTS trading. It never falls back to defaults.

# paper | live | halt
#   paper -> orders go to Alpaca paper
#   live  -> orders go to Robinhood MCP via the executor
#   halt  -> reject every proposal and close open positions
mode: paper

account:
  # Position sizing is validated against this until the broker reports equity.
  # MUST match the funded account size or every size check is wrong.
  starting_equity: 10000.00

risk:
  max_position_pct: 0.15            # max single position as fraction of equity
  max_leveraged_exposure_pct: 0.20  # max total leveraged-ETF exposure
  max_long_exposure_pct: 1.00       # total long market value / equity
  max_gross_exposure_pct: 1.15      # longs + absolute shorts / equity
  # Position count is not the binding risk control in the sleeve portfolio
  # (~79 names by design); per-name and gross caps are. 8 was a relic of the
  # original concentrated design and would have blocked the launch.
  max_positions: 120
  stop_loss_pct: 0.08               # floor stop distance
  stop_atr_multiple: 2.0            # ATR14-based stop distance
  max_stop_distance_pct: 0.15       # hard cap so a wild ATR can't create an absurd stop
  daily_loss_limit_pct: 0.04        # -4% on the day -> no new entries
  monthly_kill_switch_pct: 0.10     # -10% MTD  -> flatten to cash until the 1st
  peak_drawdown_halt_pct: 0.18      # -18% from peak -> halt, require manual restart
  allow_averaging_down: false       # never true
  loss_reentry_block_days: 5        # no re-entry in a ticker exited at a loss
  max_short_exposure_pct: 0.15      # total short notional cap (matches MOM_LS target)

sleeves:
  momentum:
    allocation: 0.45
    lookback_months: 6
    skip_months: 1
    hold_top_n: 4
    universe: [XLK, XLE, XLV, XLF, XLI, XLY, XLP, XLU, XLB, XLRE, XLC,
               QQQ, IWM, EFA, EEM, GLD, TLT]
    risk_off_symbol: SHY
  pead:
    allocation: 0.20
    min_gap_pct: 0.04
    min_volume_multiple: 2.0
    min_close_range_pct: 0.67       # close in top third of the day's range
    max_positions: 2
    max_hold_days: 20
    profit_target_pct: 0.15
  mean_reversion:
    allocation: 0.20
    rsi_period: 2
    rsi_entry: 5
    rsi_exit: 70
    max_hold_days: 6
    stop_pct: 0.06
  leveraged:
    allocation: 0.15
    symbols: [TQQQ, SOXL, UPRO]
    max_vix: 22.0
    trend_symbol: QQQ

universe:
  min_price: 5.00
  # 20-day average dollar volume. 20M was sized for institutional capital and
  # rejected ~20 names a day at a ~$75 slot size — 0.004% of a 2M-ADV name's
  # daily volume. Lowered 2026-08-03; revisit if account equity grows an order
  # of magnitude.
  min_avg_dollar_volume: 3000000
  exclude_ipo_days: 180
  # Shorting enabled 2026-07-23 with user authorization, for the Alpaca
  # paper/live path (verified shortable account). The old Robinhood-parity
  # rationale for refusing shorts is obsolete — plan of record is Alpaca.
  allow_short: true
  inverse_etfs: [SH, PSQ, SQQQ, SDS]

execution:
  order_type: limit                 # never market
  max_limit_slippage_pct: 0.003     # marketable limit, <= 0.30% through the touch
  no_entry_first_minutes: 10
  no_entry_last_minutes: 10
  market_open: "09:30"
  market_close: "16:00"
  timezone: America/New_York

# --------------------------------------------------------------------------
# Paper portfolio (Alpaca) — the evidence-backed stack, long-only v1.
# Deferred to iterations: options overlays, MOM_LS (needs shorts), LLM veto.
paper_portfolio:
  sleeves:
    equity_core: 0.40   # unconditional SPY core; replaced invalidated clone study
    tsmom: 0.25         # asset-class trend, long/flat, inverse-vol weights
    trend: 0.20         # SPY above 200DMA, else cash
    mom_ls: 0.15        # market-neutral momentum: 15% long AND 15% short
  clone_top_n: 3
  mom_ls_top_n: 20
  mom_ls_min_price: 5.0
  mom_ls_min_dollar_volume: 5000000
  # weekly-built target file; sleeve stands down if this goes stale
  mom_ls_targets_file: state/mom_ls_targets.json
  mom_ls_max_age_days: 10
  tsmom_universe: [GLD, SLV, DBC, USO, UNG, DBA, TLT, IEF, LQD, HYG, EMB, VNQ, UUP, FXE, FXY]
  trend_symbol: SPY
  trend_ma_days: 200
  tsmom_lookback_days: 252
  tsmom_min_dollar_volume: 1000000
  # Trade only when a position drifts >20% from target, or >= $25 absolute —
  # tiny rebalances would be pure cost.
  rebalance_band: 0.20
  min_order_notional: 25.0
  # Gross exposure multiplier applied to all sleeve weights. 1.0 = unlevered.
  gross_leverage: 1.0
  volatility_overlay:
    mode: "off"
    target_vol: 0.12
    lookback_days: 63
    min_observations: 32
    min_scale: 0.25
