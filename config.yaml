# Trading bot configuration.
#
# EVERY risk limit lives here. Nothing is hardcoded in Python.
# This file is version-controlled: each change is an auditable diff you can
# correlate against the equity curve later.
#
# An invalid config HALTS trading. It never falls back to defaults.

# paper | live | halt
#   paper -> orders go to Alpaca paper
#   live  -> orders go to Robinhood MCP via the executor
#   halt  -> reject every proposal and close open positions
mode: paper

account:
  # Position sizing is validated against this until the broker reports equity.
  # MUST match the funded account size or every size check is wrong.
  starting_equity: 10000.00

risk:
  max_position_pct: 0.15            # max single position as fraction of equity
  max_leveraged_exposure_pct: 0.20  # max total leveraged-ETF exposure
  max_long_exposure_pct: 1.00       # total long market value / equity
  max_gross_exposure_pct: 1.15      # longs + absolute shorts / equity
  # Position count is not the binding risk control in the sleeve portfolio
  # (~79 names by design); per-name and gross caps are. 8 was a relic of the
  # original concentrated design and would have blocked the launch.
  max_positions: 120
  stop_loss_pct: 0.08               # floor stop distance
  stop_atr_multiple: 2.0            # ATR14-based stop distance
  max_stop_distance_pct: 0.15       # hard cap so a wild ATR can't create an absurd stop
  daily_loss_limit_pct: 0.04        # -4% on the day -> no new entries
  monthly_kill_switch_pct: 0.10     # -10% MTD  -> flatten to cash until the 1st
  peak_drawdown_halt_pct: 0.18      # -18% from peak -> halt, require manual restart
  allow_averaging_down: false       # never true
  loss_reentry_block_days: 5        # no re-entry in a ticker exited at a loss
  max_short_exposure_pct: 0.15      # total short notional cap (matches MOM_LS target)
  # Per-position stops and the revenge-trade block were never backtested on
  # MOM_LS — production_portfolio.py models a pure weekly rebalance. When they
  # finally were (reports/risk_overlay_study.json) the stop cost 0.69-1.44pp of
  # CAGR and Sharpe in BOTH windows and BOTH profiles, and raised turnover 36%.
  # The block does nothing without the stop: a rotation exit drops a name from
  # the ranks anyway, so only a stop-out leaves one ranked and then barred.
  # A sleeve that rebalances weekly does not also need to be stopped out of its
  # own signal. Empty lists restore the old behaviour everywhere.
  # equity_core and lev_trend added 2026-09-14: the evidence for the M6
  # portfolio (reports/portfolio_mix_study.json) comes from
  # backtest/deployable_sim.py, which carries no per-position stop — an
  # 8% ATR stop on an 80% SPY core with a 5-day re-entry block would be an
  # un-modelled control on most of the book (AGENTS.md: a risk control is a
  # strategy change). The kill switches below are untouched.
  stop_exempt_sleeves: [mom_ls, equity_core, lev_trend]
  reentry_block_exempt_sleeves: [mom_ls, equity_core, lev_trend]
  # equity_core (0.55 since 2026-09-14; 0.40 before) + trend (0.20) target
  # 75% of equity in SPY whenever trend is on — both sleeves are the same diversified index, not a
  # concentrated single-name bet, so the per-name cap that exists to bound
  # idiosyncratic risk doesn't apply to their combination the way it does to
  # a MOM_LS or TSMOM name. Without this, max_position_pct silently capped
  # the sleeve at a quarter of its target: confirmed live, SPY was rejected
  # at the 15% cap on 19 of the last ~19 rebalance opportunities
  # (2026-07-24 through 2026-08-03), holding ~15% instead of 60%. 0.65 is
  # the 60% target plus headroom so ordinary price drift between rebalances
  # doesn't immediately re-trip the cap.
  # 0.85 since the 2026-09-14 M6 adoption: equity_core alone is 0.80 of
  # equity, plus drift headroom. lev_trend's QLD (0.20 target) is above the
  # 15% single-name cap too and is bounded by max_leveraged_exposure_pct
  # instead — the same "diversified index, not a single name" reasoning.
  elevated_position_pct: 0.85
  elevated_position_sleeves: [equity_core, trend, lev_trend]

sleeves:
  momentum:
    allocation: 0.45
    lookback_months: 6
    skip_months: 1
    hold_top_n: 4
    universe: [XLK, XLE, XLV, XLF, XLI, XLY, XLP, XLU, XLB, XLRE, XLC,
               QQQ, IWM, EFA, EEM, GLD, TLT]
    risk_off_symbol: SHY
  pead:
    allocation: 0.20
    min_gap_pct: 0.04
    min_volume_multiple: 2.0
    min_close_range_pct: 0.67       # close in top third of the day's range
    max_positions: 2
    max_hold_days: 20
    profit_target_pct: 0.15
  mean_reversion:
    allocation: 0.20
    rsi_period: 2
    rsi_entry: 5
    rsi_exit: 70
    max_hold_days: 6
    stop_pct: 0.06
  leveraged:
    allocation: 0.15
    symbols: [TQQQ, SOXL, UPRO, QLD, SSO]   # QLD/SSO: lev_trend vehicles (2026-09-14)
    max_vix: 22.0
    trend_symbol: QQQ

universe:
  min_price: 5.00
  # 20-day average dollar volume. 20M was sized for institutional capital and
  # rejected ~20 names a day at a ~$75 slot size — 0.004% of a 2M-ADV name's
  # daily volume. Lowered 2026-08-03; revisit if account equity grows an order
  # of magnitude.
  min_avg_dollar_volume: 3000000
  exclude_ipo_days: 180
  # Shorting enabled 2026-07-23 with user authorization, for the Alpaca
  # paper/live path (verified shortable account). The old Robinhood-parity
  # rationale for refusing shorts is obsolete — plan of record is Alpaca.
  allow_short: true
  inverse_etfs: [SH, PSQ, SQQQ, SDS]

execution:
  order_type: limit                 # never market
  max_limit_slippage_pct: 0.003     # marketable limit, <= 0.30% through the touch
  no_entry_first_minutes: 10
  no_entry_last_minutes: 10
  market_open: "09:30"
  market_close: "16:00"
  timezone: America/New_York

# --------------------------------------------------------------------------
# Paper portfolio (Alpaca) — the evidence-backed long/short stack.
# Options research remains read-only/shadow; no LLM participates in trading.
paper_portfolio:
  sleeves:
    # Mix M6 from reports/portfolio_mix_study.json (pre-registered campaign,
    # 2026-09-14): the only registered mix to beat SPY on CAGR and excess
    # Sharpe in full (2006-06+), early_2020_2022 and heldout_2023_plus with
    # drawdown inside the paired-bootstrap band. 0.80 SPY + 0.20 lev_trend
    # (QLD while QQQ > 200DMA, else BIL). tsmom (2.45% CAGR since 2007,
    # dominated by HAA in every window) and the SPY-only trend sleeve are
    # stood down: the trend filter now lives in lev_trend. Under paper
    # validation per reports/absolute_return_paper_validation_registration.json.
    equity_core: 0.80   # unconditional SPY core
    tsmom: 0.0          # stood down 2026-09-14 (was 0.25)
    trend: 0.0          # stood down 2026-09-14 (was 0.20; superseded by lev_trend)
    lev_trend: 0.20     # QQQ > 200DMA -> QLD, else BIL
    # mom_ls stood down 2026-09-14 (was 0.15 long AND 0.15 short). Seven
    # weeks live (2026-07-23..09-14) it was the entire loss on both accounts:
    # a mark-to-market decomposition of the server journal put it at -$144
    # (long -$101, short -$43) against +$49 from every other sleeve, while
    # SPY rose 3.2% and the momentum factor itself was up strongly. It never
    # ran market-neutral — at a ~$75 slot roughly half the shorts round
    # below one whole share — and on the repo's own panel the short leg's
    # entire value was 2022 (+58%), losing 44%/6%/36% in 2023/24/25. The
    # freed 15% went to equity_core. Replacement candidates (long-only
    # vol-scaled momentum, trend-filtered leveraged index, HAA) are being
    # studied under a benchmark-beats-SPY objective before anything new
    # goes live. Setting this to 0.0 (not deleting the key) keeps the
    # sleeve's code path and tests intact.
    mom_ls: 0.0
  clone_top_n: 3
  mom_ls_top_n: 20
  mom_ls_min_price: 5.0
  # Two liquidity floors govern MOM_LS, deliberately, at different times:
  # this one filters candidates when scripts/weekly.py ranks the universe
  # (stricter, so a name has to be liquid at selection); universe.
  # min_avg_dollar_volume above is the daily risk-gate floor every proposal
  # is re-checked against regardless of sleeve. This one must stay >= that
  # one — it's the backstop against a name's liquidity decaying over the
  # week between selection and the daily rebalance trade that fills it, not
  # a second copy of the same number. If they ever need to diverge the other
  # way, the gate becomes the binding constraint and this comment is wrong.
  mom_ls_min_dollar_volume: 5000000
  # weekly-built target file; sleeve stands down if this goes stale
  mom_ls_targets_file: state/mom_ls_targets.json
  mom_ls_max_age_days: 10
  tsmom_universe: [GLD, SLV, DBC, USO, UNG, DBA, TLT, IEF, LQD, HYG, EMB, VNQ, UUP, FXE, FXY]
  trend_symbol: SPY
  trend_ma_days: 200
  # lev_trend sleeve (backtest/trend_leveraged_index_study.py): signal on the
  # index, holding in its 2x daily-reset ETF, reserve in T-bills. The vehicle
  # must be listed in sleeves.leveraged.symbols (validated at load).
  lev_trend_index: QQQ
  lev_trend_vehicle: QLD
  lev_trend_reserve_symbol: BIL
  lev_trend_ma_days: 200
  # Live incident, 2026-09-15: Alpaca's IEX feed shows QLD ~$3.0M and SSO
  # ~$2.3M 20d dollar volume, both under the generic $3M universe floor,
  # against $300-400M/day on Tiingo's consolidated tape. QLD is the
  # sleeve's only buy target, so the generic floor rejected every QLD
  # entry on the sleeve's first live day. Order sizes here (a few thousand
  # dollars) are immaterial against even the IEX-only volume, so $1M
  # (matching tsmom_min_dollar_volume's precedent) is a safe floor, not a
  # loosened one. See engine/risk.py's matching substitution.
  lev_trend_min_dollar_volume: 1000000
  tsmom_lookback_days: 252
  tsmom_min_dollar_volume: 1000000
  # Trade only when a position drifts >20% from target, or >= $25 absolute —
  # tiny rebalances would be pure cost.
  rebalance_band: 0.20
  # ...but never more than 5% of equity: a fraction-of-target band lets a
  # large sleeve drift a long way — SPY's 75% target on $10k needs ~$1,500
  # of gap before it trades, so 15% of equity sat idle after mom_ls's
  # weight was folded into equity_core (2026-09-14). Small slots are
  # unaffected (their band is already below min_order_notional).
  rebalance_band_equity_cap: 0.05
  min_order_notional: 25.0
  # Gross exposure multiplier applied to all sleeve weights. 1.0 = unlevered.
  gross_leverage: 1.0
  volatility_overlay:
    mode: "off"
    target_vol: 0.12
    lookback_days: 63
    min_observations: 32
    min_scale: 0.25
