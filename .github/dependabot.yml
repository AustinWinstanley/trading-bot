version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    directory: /dashboard
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    directory: /mcp_server
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /mcp_server
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # ci: not chore: — these bumps change workflow files, matching
    # @commitlint/config-conventional's own type-enum (which includes ci
    # specifically for CI configuration changes).
    commit-message:
      prefix: ci
      include: scope
