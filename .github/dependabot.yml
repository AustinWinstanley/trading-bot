version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /dashboard
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /mcp_server
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /mcp_server
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
