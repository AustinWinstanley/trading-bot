# 2x LEVERED paper profile — the parallel experiment.
# Same sleeves and signals as config.yaml, gross exposure doubled, kill
# switches scaled to the levered path (daily -8%, monthly -20%, halt -35%).
# Starting equity $10,000. Uses ALPACA_API_KEY_2X / ALPACA_API_SECRET_2X.
mode: paper
account:
  starting_equity: 10000.0
risk:
  max_position_pct: 0.3
  max_leveraged_exposure_pct: 0.4
  max_long_exposure_pct: 2.0
  max_gross_exposure_pct: 2.3
  max_positions: 120
  stop_loss_pct: 0.08
  stop_atr_multiple: 2.0
  max_stop_distance_pct: 0.15
  daily_loss_limit_pct: 0.08
  monthly_kill_switch_pct: 0.2
  peak_drawdown_halt_pct: 0.35
  allow_averaging_down: false
  loss_reentry_block_days: 5
  max_short_exposure_pct: 0.3
  # See config.yaml — the overlay cost 1.38-1.44pp of CAGR on this profile.
  stop_exempt_sleeves: [mom_ls]
  reentry_block_exempt_sleeves: [mom_ls]
  # See config.yaml — same gap, doubled: equity_core+trend target 120% here
  # (0.60 * 2x leverage), confirmed live rejected at the 30% cap on 14 of the
  # last ~14 opportunities. 1.30 is the 120% target plus headroom.
  elevated_position_pct: 1.30
  elevated_position_sleeves: [equity_core, trend]
  # Lab-only, evidence-driven relaxation of the otherwise-unconditional
  # no-averaging-down rule (see reports/target_restoration_study.json:
  # Sharpe higher and CAGR not lower in 4/4 backtested cells, at a
  # 0.19-0.60pp max-drawdown cost in 3/4 — rejected by the hard gate's
  # zero-tolerance drawdown rule, judged worth the lab's lighter
  # experiment-tier bar per AGENTS.md's "experiment tier" section). Adds no
  # new sizing logic: mom_ls's target is momentum-rank-driven with no
  # reference to a position's P&L, so a rebalance proposal (target - held)
  # is already capped at the same target this position would have if it
  # were not a loser, and every other position/exposure cap still applies
  # on top. base config.yaml deliberately does not set this — it is the
  # unchanged control.
  restoration_exempt_sleeves: [mom_ls]
sleeves:
  momentum:
    allocation: 0.45
    lookback_months: 6
    skip_months: 1
    hold_top_n: 4
    universe:
    - XLK
    - XLE
    - XLV
    - XLF
    - XLI
    - XLY
    - XLP
    - XLU
    - XLB
    - XLRE
    - XLC
    - QQQ
    - IWM
    - EFA
    - EEM
    - GLD
    - TLT
    risk_off_symbol: SHY
  pead:
    allocation: 0.2
    min_gap_pct: 0.04
    min_volume_multiple: 2.0
    min_close_range_pct: 0.67
    max_positions: 2
    max_hold_days: 20
    profit_target_pct: 0.15
  mean_reversion:
    allocation: 0.2
    rsi_period: 2
    rsi_entry: 5
    rsi_exit: 70
    max_hold_days: 6
    stop_pct: 0.06
  leveraged:
    allocation: 0.15
    symbols:
    - TQQQ
    - SOXL
    - UPRO
    max_vix: 22.0
    trend_symbol: QQQ
universe:
  min_price: 5.0
  min_avg_dollar_volume: 3000000
  exclude_ipo_days: 180
  allow_short: true
  inverse_etfs:
  - SH
  - PSQ
  - SQQQ
  - SDS
execution:
  order_type: limit
  max_limit_slippage_pct: 0.003
  no_entry_first_minutes: 10
  no_entry_last_minutes: 10
  market_open: 09:30
  market_close: '16:00'
  timezone: America/New_York
paper_portfolio:
  sleeves:
    equity_core: 0.4
    tsmom: 0.25
    trend: 0.2
    mom_ls: 0.15
  clone_top_n: 3
  # 15, not config.yaml's 20 — reports/momentum_breadth_study.json's
  # sensitivity-only "15" candidate improved max drawdown in 4/4 backtested
  # cells vs the 20-name control, at a Sharpe/CAGR cost in 3/4 (1/4 improved
  # everything). It was structurally ineligible for promotion under that
  # study's own pre-registration (10 was the primary candidate, tested and
  # correctly rejected — worse on every metric), so this is not a
  # promotion, it's the 2x lab trying a plausible-evidence risk/return
  # tradeoff under AGENTS.md's lighter "experiment tier" bar. Needs its own
  # mom_ls_targets_file (below) — see scripts/weekly.py's build_mom_ls_targets.
  mom_ls_top_n: 15
  mom_ls_min_price: 5.0
  mom_ls_min_dollar_volume: 5000000
  mom_ls_targets_file: state/mom_ls_targets_2x.json
  mom_ls_max_age_days: 10
  # 14 assets, not config.yaml's 15 — FXE dropped. reports/tsmom_fxe_drop_study.json:
  # FXE is the ONLY tsmom asset ever rejected in either account's live journal
  # (8/8 rejections since sleeve tagging began, always the $1M 20d-dollar-volume
  # floor — FXE trades ~$240k-360k), permanently stranding ~3.5%/7.1% of
  # equity as idle cash whenever its trend signal is on. Backtest control-
  # reproduction was exact (0.0 diff vs reports/production_portfolio.json).
  # Sharpe higher and CAGR not lower in all 4 screening cells; only a
  # trivial (0.10-0.16pp) drawdown cost in 2 of 4, which the study's own
  # standalone-sleeve diagnostic attributes to a cross-sleeve timing
  # coincidence, not FXE removal creating new tail risk. Screening-tier
  # evidence (pre-2026-08-13), 2x-lab experiment-tier bar, not the hard
  # promotion gate — config.yaml keeps FXE, unchanged control.
  tsmom_universe:
  - GLD
  - SLV
  - DBC
  - USO
  - UNG
  - DBA
  - TLT
  - IEF
  - LQD
  - HYG
  - EMB
  - VNQ
  - UUP
  - FXY
  trend_symbol: SPY
  trend_ma_days: 200
  tsmom_lookback_days: 252
  tsmom_min_dollar_volume: 1000000
  rebalance_band: 0.2
  min_order_notional: 25.0
  gross_leverage: 2.0
  volatility_overlay:
    # "active" applies the bounded scale after 32 daily observations.
    # Keep "shadow" as the checked-in control until explicitly promoted.
    mode: "shadow"
    target_vol: 0.12
    lookback_days: 63
    min_observations: 32
    min_scale: 0.25
  options_experiments:
    bull_put_fixed_width:
      # Read-only quote/Greek collection. This mode cannot submit an order.
      mode: "shadow"
      target_dte: 45
      short_moneyness: 0.90
      strike_width: 5.0
      max_loss_pct: 0.05
    bull_put_delta_selected:
      # Selection/economics parameters shared with the real order-submission
      # path (scripts/options_daily.py, registered as the "paper"-status
      # experiment bull_put_delta_selected_live in experiments: below) —
      # this mode toggle only controls the read-only shadow collector
      # (scripts/options_shadow.py), which keeps running independently so
      # observations keep accruing toward its own 20-obs/3-expiration bar.
      mode: "shadow"
      target_dte: 45
      target_short_delta: 0.20
      strike_width: 5.0
      min_credit_pct_of_width: 0.15
      max_loss_pct: 0.05
      # scripts/options_daily.py only: force-close an open structure at or
      # before this many trading days to expiration. Not backtested (see
      # reports/bull_put_fixed_width_study.json's own limitations — American
      # early assignment isn't reconstructed in this repo's backtests) — a
      # risk-management convention, not a claimed-optimal number. Short-put
      # assignment risk concentrates in the final 1-2 weeks as extrinsic
      # value decays.
      close_by_dte_trading_days: 5
    put_broken_wing_butterfly:
      mode: "shadow"
      target_dte: 45
      target_upper_delta: 0.25
      upper_width: 2.0
      lower_width: 4.0
      max_entry_debit: 0.50
      min_peak_profit_dollars: 100.0
      max_realized_vol: 0.15
      max_loss_pct: 0.05
    momentum_verticals:
      # Off, not shadow: this applies option leverage to individual MOM_LS
      # ranks with no options-level return study behind it — the same
      # move the 1DTE translator was deliberately stood down to avoid
      # ("without using option leverage to disguise a negative underlying
      # signal"; reports/intraday_1dte_shadow_launch.json). The nearest
      # comparable evidence, bull_call_spread_study.json, was rejected (6
      # completed spreads, 2 winners, -$606 combined). Re-enable only after
      # a dedicated single-name-vertical study exists.
      mode: "off"
      target_dte: 60
      long_delta: 0.60
      short_delta: 0.35
      max_debit_pct: 0.02
      min_reward_to_risk: 1.50
      max_rank_attempts_per_side: 3
    event_volatility:
      mode: "shadow"
      observation_window_days: 10
      events:
      - {name: "CPI", date: "2026-09-11"}
      - {name: "FOMC", date: "2026-09-16"}
      - {name: "CPI", date: "2026-10-14"}
      - {name: "FOMC", date: "2026-10-28"}
      - {name: "CPI", date: "2026-11-10"}
      - {name: "FOMC", date: "2026-12-09"}
      - {name: "CPI", date: "2026-12-10"}
    zero_dte_surface:
      # Quote collection only. No strategy in the current intraday screen
      # qualified, so directional_enabled remains false.
      mode: "shadow"
      directional_enabled: false
      short_distance_pct: 0.005
      wing_width: 5.0
      min_credit_pct_of_width: 0.10
      max_loss_pct: 0.05

# The experiment tier (engine/config.py's ExperimentConfig, engine/risk.py's
# gate governance, engine/options_risk.py for the options-specific gate,
# AGENTS.md's "experiment tier" section) — a second, lighter-weight evidence
# bar for capped, pre-registered paper-trading experiments in this lab
# account, distinct from the options_experiments read-only shadows above
# and from the hard promotion gate that governs core allocation.
experiments:
  bull_put_delta_selected_live:
    # Real (paper-broker) multi-leg options orders — scripts/options_daily.py.
    # Promoted on 3/20 shadow observations (1/3 required expirations) —
    # short of options_experiments.bull_put_delta_selected's own declared
    # review bar in the shadow launch doc. Deliberate, human-approved
    # exception: live paper trading is how the remaining evidence gets
    # collected, per this project's "learnings over exact backtest results"
    # priority — see reports/experiments/bull_put_delta_selected_live.json
    # for the full disclosure. Distinct from bull_put_fixed_width, which
    # reports/bull_put_fixed_width_study.json already rejected outright
    # (insufficient_evidence, 0 completed spreads) and is not a candidate.
    status: paper
    # 6%, not the 1-2% smaller default: at this structure's live-quoted
    # ~$490/contract maximum_loss (4.8% of ~$10,266 equity), 1-2% cannot
    # afford even one contract — the experiment would be registered but
    # structurally unable to ever trade. 6% is the smallest allocation that
    # clears one contract with margin, still far under the 30% aggregate
    # experiment-tier cap (engine/config.py's MAX_TOTAL_EXPERIMENT_ALLOCATION_PCT).
    allocation_pct: 0.06
    # Equal to allocation_pct: one bad structure may cost at most its whole
    # allocation, capped further by engine/options_risk.py's hard 1-open-
    # structure-per-experiment limit (no laddering, no rolling in v1).
    max_cumulative_loss_pct: 0.06
    registration: reports/experiments/bull_put_delta_selected_live.json
